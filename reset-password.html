<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Sneakers</title>
    <link rel="stylesheet" href="/styles/main.css">
    <style>
        /* ============================================================
           RESET PASSWORD · Linear dark auth page
           Restyle only — markup, ids, handlers preserved.
           Tokens + components come from /styles/main.css
           ============================================================ */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: var(--sp-6);
            background: var(--bg-app);
            color: var(--text-1);
            font-family: var(--font);
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow: hidden;
        }
        /* faint ambient indigo glow behind the card */
        body::before {
            content: "";
            position: fixed;
            top: -240px;
            left: 50%;
            transform: translateX(-50%);
            width: 900px;
            height: 520px;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(94,106,210,.15), transparent 68%);
        }

        /* hidden inline icon sprite (this is a standalone page; app.html's sprite isn't here) */
        .icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
        .ic { width: 16px; height: 16px; flex: none; display: inline-block; vertical-align: middle; }
        .ic-12 { width: 12px; height: 12px; }
        .ic-14 { width: 14px; height: 14px; }
        .ic-20 { width: 20px; height: 20px; }

        .reset-container {
            position: relative;
            z-index: var(--z-base);
            width: 100%;
            max-width: 400px;
            padding: 30px 30px 26px;
            background: var(--bg-2);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.04);
        }

        /* brand mark + heading block leading the card */
        .reset-head {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 24px;
        }
        .reset-mark {
            width: 44px;
            height: 44px;
            margin-bottom: 16px;
            border-radius: var(--r-lg);
            display: grid;
            place-items: center;
            color: var(--accent-text);
            background: linear-gradient(180deg, var(--bg-4), var(--bg-3));
            border: 1px solid var(--border-2);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 1px 2px rgba(0,0,0,.3);
        }
        .reset-mark .ic { width: 21px; height: 21px; }

        h1 {
            color: var(--text-1);
            font-size: 19px;
            font-weight: 600;
            letter-spacing: -.02em;
            line-height: 1.25;
            margin: 0;
        }
        .reset-sub {
            margin-top: 7px;
            color: var(--text-3);
            font-size: 13px;
            line-height: 1.5;
            max-width: 30ch;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 16px;
        }

        label {
            display: block;
            color: var(--text-2);
            font-size: 12.5px;
            font-weight: 500;
        }

        /* Slightly taller inputs for the auth card; skin from .input */
        .reset-container .input {
            height: 38px;
            padding: 0 12px;
            font-size: 13.5px;
        }

        /* Larger auth-page proportions on top of the shared .btn skin */
        .reset-container .btn {
            height: 40px;
            margin-top: 4px;
            padding: 0 18px;
            border-radius: var(--r-md);
            font-size: 14px;
            font-weight: 510;
        }

        .alert {
            padding: 10px 12px;
            border-radius: var(--r-sm);
            border: 1px solid transparent;
            margin-bottom: 18px;
            font-size: 13px;
            line-height: 1.5;
            text-align: center;
        }
        .alert:empty { display: none; }
        .alert-success {
            background: var(--green-soft);
            color: var(--green-text);
            border-color: rgba(76,183,130,.3);
        }
        .alert-error {
            background: var(--red-soft);
            color: var(--red-text);
            border-color: rgba(235,87,87,.3);
        }
        .alert-info {
            background: var(--blue-soft);
            color: var(--blue-text);
            border-color: rgba(78,167,252,.3);
            text-align: left;
        }
        .alert-info code {
            display: inline-block;
            margin-top: 6px;
            padding: 6px 8px;
            background: var(--bg-inset);
            border: 1px solid var(--border-2);
            border-radius: var(--r-xs);
            font-family: var(--mono);
            font-size: 11.5px;
            color: var(--text-2);
        }

        .password-requirements {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-top: 10px;
            padding: 12px 13px;
            background: var(--bg-inset);
            border: 1px solid var(--border);
            border-radius: var(--r-sm);
            font-size: 12px;
            color: var(--text-3);
        }
        .requirement {
            display: flex;
            align-items: center;
            gap: 9px;
            margin: 0;
            color: var(--text-3);
            transition: color .12s var(--ease);
        }
        .req-check {
            width: 15px;
            height: 15px;
            flex: none;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--bg-3);
            color: var(--text-4);
            box-shadow: inset 0 0 0 1px var(--border);
            transition: background .14s var(--ease), color .14s var(--ease), box-shadow .14s var(--ease);
        }
        .req-check .ic {
            width: 9px;
            height: 9px;
            opacity: 0;
            transform: scale(.5);
            transition: opacity .14s var(--ease), transform .14s var(--ease);
        }
        .requirement.met { color: var(--text-1); }
        .requirement.met .req-check {
            background: var(--green-soft);
            color: var(--green);
            box-shadow: inset 0 0 0 1px rgba(76,183,130,.4);
        }
        .requirement.met .req-check .ic {
            opacity: 1;
            transform: scale(1);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }
        .back-link a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-3);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: color .12s var(--ease);
        }
        .back-link a .ic { color: var(--text-4); transition: color .12s var(--ease); }
        .back-link a:hover { color: var(--text-1); }
        .back-link a:hover .ic { color: var(--text-2); }
    </style>
</head>
<body>
    <!-- inline icon sprite (standalone page — keeps icons crisp without app.html) -->
    <svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6 5 12l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-shield-check" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6l7-3Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m9 12 2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></symbol>
        <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol>
    </svg>

    <div class="reset-container">
        <!-- Request Reset Form -->
        <div id="requestForm">
            <div class="reset-head">
                <div class="reset-mark"><svg class="ic"><use href="#i-lock"/></svg></div>
                <h1>Reset password</h1>
                <p class="reset-sub">Enter your email and we'll send you a link to reset your password.</p>
            </div>
            <div id="requestAlert"></div>
            <form id="resetRequestForm">
                <div class="form-group field">
                    <label class="label" for="email">Email address</label>
                    <input class="input" type="email" id="email" name="email" required placeholder="you@company.com">
                </div>
                <button class="btn btn--primary btn--block" type="submit" id="requestBtn">Send reset link</button>
            </form>
            <div class="back-link">
                <a href="/"><svg class="ic ic-14"><use href="#i-arrow-left"/></svg>Back to login</a>
            </div>
        </div>

        <!-- Update Password Form (shown when token present) -->
        <div id="updateForm" style="display: none;">
            <div class="reset-head">
                <div class="reset-mark"><svg class="ic"><use href="#i-shield-check"/></svg></div>
                <h1>Set a new password</h1>
                <p class="reset-sub">Choose a strong password you don't use anywhere else.</p>
            </div>
            <div id="updateAlert"></div>
            <form id="passwordUpdateForm">
                <div class="form-group field">
                    <label class="label" for="newPassword">New password</label>
                    <input class="input" type="password" id="newPassword" name="newPassword" required placeholder="Enter a new password">
                    <div class="password-requirements">
                        <div class="requirement" id="req-length"><span class="req-check"><svg class="ic"><use href="#i-check"/></svg></span>At least 8 characters</div>
                        <div class="requirement" id="req-upper"><span class="req-check"><svg class="ic"><use href="#i-check"/></svg></span>One uppercase letter</div>
                        <div class="requirement" id="req-lower"><span class="req-check"><svg class="ic"><use href="#i-check"/></svg></span>One lowercase letter</div>
                        <div class="requirement" id="req-number"><span class="req-check"><svg class="ic"><use href="#i-check"/></svg></span>One number</div>
                        <div class="requirement" id="req-special"><span class="req-check"><svg class="ic"><use href="#i-check"/></svg></span>One special character (!@#$%^&amp;*)</div>
                    </div>
                </div>
                <div class="form-group field">
                    <label class="label" for="confirmPassword">Confirm password</label>
                    <input class="input" type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-enter your new password">
                </div>
                <button class="btn btn--primary btn--block" type="submit" id="updateBtn">Update password</button>
            </form>
            <div class="back-link">
                <a href="/"><svg class="ic ic-14"><use href="#i-arrow-left"/></svg>Back to login</a>
            </div>
        </div>
    </div>

    <script>
        // Check if we have a reset token in URL
        const urlParams = new URLSearchParams(window.location.search);
        const resetToken = urlParams.get('token');

        if (resetToken) {
            // Show update form
            document.getElementById('requestForm').style.display = 'none';
            document.getElementById('updateForm').style.display = 'block';
        }

        // Password strength checker
        const passwordInput = document.getElementById('newPassword');
        if (passwordInput) {
            passwordInput.addEventListener('input', function() {
                const password = this.value;
                
                // Check requirements
                document.getElementById('req-length').classList.toggle('met', password.length >= 8);
                document.getElementById('req-upper').classList.toggle('met', /[A-Z]/.test(password));
                document.getElementById('req-lower').classList.toggle('met', /[a-z]/.test(password));
                document.getElementById('req-number').classList.toggle('met', /[0-9]/.test(password));
                document.getElementById('req-special').classList.toggle('met', /[!@#$%^&*]/.test(password));
            });
        }

        // Request reset form handler
        document.getElementById('resetRequestForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const btn = document.getElementById('requestBtn');
            const alertDiv = document.getElementById('requestAlert');
            
            btn.disabled = true;
            btn.textContent = 'Sending…';
            
            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alertDiv.className = 'alert alert-success';
                    alertDiv.textContent = 'If an account exists with this email, a reset link has been sent.';
                    this.reset();
                } else {
                    alertDiv.className = 'alert alert-error';
                    alertDiv.textContent = data.error || 'Failed to send reset email';
                }
            } catch (error) {
                alertDiv.className = 'alert alert-error';
                alertDiv.textContent = 'Network error. Please try again.';
            }
            
            btn.disabled = false;
            btn.textContent = 'Send reset link';
        });

        // Update password form handler
        document.getElementById('passwordUpdateForm')?.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = document.getElementById('updateBtn');
            const alertDiv = document.getElementById('updateAlert');
            
            if (newPassword !== confirmPassword) {
                alertDiv.className = 'alert alert-error';
                alertDiv.textContent = 'Passwords do not match';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Updating…';
            
            try {
                const response = await fetch('/api/auth/update-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ 
                        token: resetToken,
                        newPassword 
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alertDiv.className = 'alert alert-success';
                    alertDiv.textContent = 'Password updated successfully! Redirecting to login...';
                    this.reset();
                    
                    // Show instructions if provided (dev mode)
                    if (data.instructions) {
                        alertDiv.innerHTML += '<div class="alert alert-info" style="margin-top: 1rem; text-align: left;">' +
                            '<strong>Manual Update Required:</strong><br>' +
                            data.instructions.step1 + '<br>' +
                            data.instructions.step2 + '<br>' +
                            '<code style="word-break: break-all;">' + data.instructions.newHash + '</code>' +
                            '</div>';
                    } else {
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 3000);
                    }
                } else {
                    alertDiv.className = 'alert alert-error';
                    alertDiv.textContent = data.error || 'Failed to update password';
                }
            } catch (error) {
                alertDiv.className = 'alert alert-error';
                alertDiv.textContent = 'Network error. Please try again.';
            }
            
            btn.disabled = false;
            btn.textContent = 'Update password';
        });
    </script>
</body>
</html>
